# Основной движок — облачный OrcaRouter API. Ollama в этой сборке не используется.
app:
  host: 127.0.0.1
  port: 8000
memory:
  recent_messages: 20
  retrieval_results: 5
  history_days: 7
  data_dir: data
llm:
  engine: orcarouter
  model: deepseek/deepseek-v4.1-flash-free
  base_url: https://api.orcarouter.ai/v1
  # Источник истины о личности — локальный config/character.md: панель сама
  # собирает системный промпт и отправляет его в каждом запросе, версия
  # характера фиксируется отпечатком SHA-256 (см. prompt_sha в src/engines.py).
  # Ключ prompt_version: latest больше не используется и убран намеренно.
tts:
  engine: text_stub
