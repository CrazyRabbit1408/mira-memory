[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-lab"
version = "0.14.0"
description = "Память и API-диалог вымышленного персонажа"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7",
  "chromadb>=1,<2", "networkx>=3.2,<4", "httpx>=0.27,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["src*", "tools*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
